services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sqlserver

    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Password123!"

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

  app:
    build:
      context: .

    depends_on:
      - sqlserver

volumes:
  sql_data: